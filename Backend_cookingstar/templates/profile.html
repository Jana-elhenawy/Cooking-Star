{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — نجمة الطبخ</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/profile.css' %}">
  <link rel="icon" type="image/png" href="{% static 'images/icon.png' %}">
</head>
<body>

  <div id="glitter-container"></div>

  <nav class="navbar">
    <a href="/user-dashboard/" class="logo-link">
      <img src="{% static 'images/NewLogo.png' %}" alt="Cooking Star Logo" class="logo-img">
    </a>
    <div class="nav-links">
      <!-- populated by buildNavbar() in shared.js -->
    </div>
  </nav>

  <div class="page-header">
    <h1>👤 My Profile</h1>
    <p>Manage your account details and password</p>
  </div>

  <div class="profile-wrapper">

    <!-- Avatar -->
    <div class="profile-avatar-section">
      <div class="profile-avatar" id="profile-avatar">🍳</div>
      <div class="profile-display-name" id="profile-display-name">Loading…</div>
      <div class="profile-display-email" id="profile-display-email"></div>
    </div>

    <!-- ── Section 1: Personal Info ─────────────────── -->
    <div class="profile-section">
      <div class="profile-section-title">✨ Personal Information</div>

      <div class="profile-row">
        <div class="profile-field">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" placeholder="First name" maxlength="80">
        </div>
        <div class="profile-field">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" placeholder="Last name" maxlength="80">
        </div>
      </div>

      <div class="profile-field">
        <label for="gender">Gender</label>
        <select id="gender">
          <option value="">Prefer not to say</option>
          <option value="M">Male</option>
          <option value="F">Female</option>
          <option value="O">Other</option>
        </select>
      </div>

      <div id="info-error" class="profile-error"></div>
      <div id="info-success" class="profile-success"></div>

      <button class="profile-save-btn" onclick="savePersonalInfo(this)">
        💾 Save Personal Info
      </button>
    </div>

    <!-- ── Section 2: Account Settings ────────────────── -->
    <div class="profile-section">
      <div class="profile-section-title">🔧 Account Settings</div>

      <div class="profile-field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="your_username" maxlength="150" autocomplete="username">
        <div class="field-hint">Only letters, digits and @/./+/-/_ are allowed.</div>
      </div>

      <div class="profile-field">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" maxlength="254" autocomplete="email">
      </div>

      <div id="account-error" class="profile-error"></div>
      <div id="account-success" class="profile-success"></div>

      <button class="profile-save-btn" onclick="saveAccountSettings(this)">
        💾 Save Account Settings
      </button>
    </div>

    <!-- ── Section 3: Change Password ─────────────────── -->
    <div class="profile-section">
      <div class="profile-section-title">🔑 Change Password</div>

      <div class="profile-field">
        <label for="currentPassword">Current Password</label>
        <input type="password" id="currentPassword" placeholder="Enter current password" autocomplete="current-password">
      </div>

      <div class="profile-field">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="Min. 6 characters" autocomplete="new-password">
      </div>

      <div class="profile-field">
        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" placeholder="Repeat new password" autocomplete="new-password">
      </div>

      <div id="password-error" class="profile-error"></div>
      <div id="password-success" class="profile-success"></div>

      <button class="profile-save-btn" onclick="savePassword(this)">
        🔒 Update Password
      </button>
    </div>

  </div><!-- end .profile-wrapper -->

  <div id="toast"></div>

  <script src="{% static 'js/glitter.js' %}"></script>
  <script src="{% static 'js/shared.js' %}"></script>
  <script src="{% static 'js/profile.js' %}"></script>
</body>
</html>
